services:
  - type: web
    name: mesh-tech-v2
    runtime: node
    plan: free
    # repo: https://github.com/your-username/your-repo
    # branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SESSION_ID
        sync: false
      - key: MODE
        value: public
      - key: OWNER_NUMBER
        sync: false
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: AUTO_READ_STATUS
        value: "true"
      - key: AUTO_LIKE_STATUS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mesh-tech-db
          property: connectionString
      - key: PREFIX
        value: "!."
    disk:
      name: auth-storage
      mountPath: /app/auth_info
      sizeGB: 1

databases:
  - name: mesh-tech-db
    plan: free
    ipAllowList: []
