services:
  - type: web
    name: mesh-tech-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Required on Render because free services have ephemeral local filesystems.
      # Generate a Mesh~ session ID from the dashboard and add it as a secret.
      - key: SESSION_ID
        sync: false
      - key: NODE_VERSION
        value: 20
      - key: MODE
        value: public
      - key: OWNER_NUMBER
        sync: false
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: AUTO_READ_STATUS
        value: "true"
      - key: AUTO_LIKE_STATUS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mesh-tech-db
          property: connectionString
      - key: PREFIX
        value: "!."

databases:
  - name: mesh-tech-db
    plan: free
    ipAllowList: []
